<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Newtrition — بوابة العميلة</title><link rel="manifest" href="/client-manifest.json"><meta name="theme-color" content="#0f3d3e"><style>body{font-family:system-ui,sans-serif;background:#f4f7f6;color:#12211f;margin:0}.wrap{max-width:900px;margin:0 auto;padding:20px}.card{background:#fff;border:1px solid #dfe7e5;border-radius:12px;padding:16px;margin-bottom:14px}button{padding:9px 14px;border-radius:8px;border:0;background:#1a8a80;color:#fff;cursor:pointer}input{width:100%;box-sizing:border-box;padding:9px;border:1px solid #dfe7e5;border-radius:8px;margin:6px 0 10px}.hidden{display:none}.day{border-top:1px solid #eee;padding:10px 0}.item{display:flex;justify-content:space-between;padding:7px 0}</style></head><body><div class="wrap"><div id="gate" class="card"><h1>Newtrition</h1><p>تسجيل دخول العميلة</p><input id="email" type="email" placeholder="email"><input id="password" type="password" placeholder="password"><button id="login" type="button" aria-label="تسجيل الدخول">دخول</button><div id="err"></div></div><div id="app" class="hidden"><div class="card"><button id="logout">خروج</button><h1 id="name"></h1><div id="plan"></div></div><div class="card"><h2>المتابعات</h2><div id="fups"></div><input id="visit" type="date"><input id="weight" type="number" step="0.1" placeholder="الوزن"><input id="waist" type="number" step="0.1" placeholder="الخصر"><input id="adherence" type="number" step="1" placeholder="الالتزام %"><button id="save">حفظ متابعة</button></div></div></div><script>const API=location.origin+'/api/client';const AUTH=location.origin+'/api/client-auth';const gate=document.getElementById('gate'),app=document.getElementById('app'),err=document.getElementById('err');const esc=v=>String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));const api=async(p,o={})=>{o.credentials='same-origin';o.headers=Object.assign({'X-Requested-With':'newtrition-client'},o.headers||{});if(o.body)o.headers['Content-Type']='application/json';const r=await fetch(API+p,o);if(!r.ok){let m='request_failed';try{m=(await r.json()).error||m}catch{}throw new Error(m)}return r.json()};const login=async()=>{err.textContent='';try{await auth('/login',{method:'POST',body:JSON.stringify({email:email.value,password:password.value})});await boot()}catch(e){err.textContent='تعذر تسجيل الدخول'}};const auth=async(p,o={})=>{o.credentials='same-origin';o.headers=Object.assign({'X-Requested-With':'newtrition-client'},o.headers||{});if(o.body)o.headers['Content-Type']='application/json';const r=await fetch(AUTH+p,o);if(!r.ok){let m='request_failed';try{m=(await r.json()).error||m}catch{}throw new Error(m)}return r.json()};async function boot(){try{const me=await auth('/me');name.textContent='مرحبًا '+String(me.full_name||'');gate.classList.add('hidden');app.classList.remove('hidden');loadPlan();loadFups()}catch{gate.classList.remove('hidden');app.classList.add('hidden')}}async function loadPlan(){try{const d=await api('/plan');plan.innerHTML='<h2>'+esc(d.plan.label)+'</h2><div>السعرات: '+esc(d.plan.target_kcal)+' · البروتين: '+esc(d.plan.target_protein_g)+'g</div>'+d.days.map(day=>'<div class="day"><b>اليوم '+(day.day_index+1)+'</b>'+day.items.map(i=>'<div class="item"><span>'+esc(i.name_ar||i.custom_name||'—')+' · '+esc(i.slot)+'</span><span>'+esc((i.kcal??i.custom_kcal)??'—')+' kcal</span></div>').join('')+'</div>').join('')}catch{plan.innerHTML='<p>لا توجد خطة منشورة حاليًا.</p>'}}async function loadFups(){const d=await api('/followups');fups.innerHTML=d.items.map(f=>'<div>'+esc(f.visit_date)+' · '+esc(f.weight_kg??'—')+' kg · '+esc(f.adherence_pct??'—')+'%</div>').join('')||'<p>لا توجد متابعات.</p>'}login.onclick=login;logout.onclick=async()=>{await auth('/logout',{method:'POST'});location.reload()};save.onclick=async()=>{try{await api('/followups',{method:'POST',body:JSON.stringify({visit_date:visit.value,weight_kg:weight.value,waist_cm:waist.value,adherence_pct:adherence.value})});loadFups()}catch{alert('لم يتم الحفظ')}};if('serviceWorker' in navigator) navigator.serviceWorker.register('/client-sw.js').catch(()=>{});boot();</script></body></html>

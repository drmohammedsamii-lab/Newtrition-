<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0E0F0E; --card:#16171A; --line:#2A2C24;
  --lime:#A9CE3A; --white:#FFFFFF; --body:#C2C2B8; --muted:#8E8F86;
  --font:"Tajawal","Cairo","Segoe UI",Tahoma,sans-serif;
  --head:"Cairo","Tajawal","Segoe UI",Tahoma,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--body);font-family:var(--font)}
header{position:sticky;top:0;background:rgba(14,15,14,.97);backdrop-filter:blur(6px);z-index:10;border-bottom:1px solid var(--line);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
header h1{margin:0;font-family:var(--head);color:var(--white);font-size:18px}
header .sub{color:var(--muted);font-size:11px;margin-top:2px}
a.back{color:var(--lime);text-decoration:none;font-size:13px}
.nav{display:flex;gap:8px;align-items:center}
.nav button{background:var(--card);border:1px solid var(--line);color:var(--white);border-radius:8px;padding:7px 12px;cursor:pointer;font-family:var(--font)}
.nav button:disabled{opacity:.4;cursor:default}
.nav .pageindicator{color:var(--body);font-size:13px;min-width:70px;text-align:center}
.viewer{max-width:700px;margin:20px auto;padding:0 12px}
.page{display:none;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:14px}
.page.active{display:block}
.page img{width:100%;display:block}
.thumbs{display:flex;flex-wrap:wrap;gap:6px;max-width:900px;margin:20px auto;padding:0 12px}
.thumbs img{width:60px;height:auto;border-radius:4px;border:2px solid transparent;cursor:pointer;opacity:.7}
.thumbs img.active{border-color:var(--lime);opacity:1}
footer{text-align:center;color:var(--muted);font-size:11px;padding:20px}
</style>
</head>

<script>
let current = 1;
const total = 41;
function render() {
  document.querySelectorAll('.page').forEach(p => p.classList.toggle('active', +p.dataset.page === current));
  document.getElementById('pageIndicator').textContent = current + ' / ' + total;
  document.getElementById('prevBtn').disabled = current === 1;
  document.getElementById('nextBtn').disabled = current === total;
  document.querySelectorAll('.thumbs img').forEach(t => t.classList.toggle('active', +t.dataset.page === current));
  window.scrollTo({top:0, behavior:'smooth'});
}
function go(delta) {
  current = Math.min(total, Math.max(1, current + delta));
  render();
}
const thumbsDiv = document.getElementById('thumbs');
for (let i=1;i<=total;i++) {
  const img = document.createElement('img');
  img.src = 'weight-loss-guide-images/'+i+'.jpeg';
  img.dataset.page = i;
  img.loading = 'lazy';
  img.onclick = () => { current = i; render(); };
  thumbsDiv.appendChild(img);
}
render();
</script>
